[package]
name = "anits"
version = "0.1.2"
edition = "2021"
authors = ["Alzhan Alan <230161358+arprge@users.noreply.github.com>"]
description = "Fast terminal UI for managing your AniList anime library"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arprge/anits"
keywords = ["anilist", "anime", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]
exclude = [".agents/", "skills-lock.json", "assets/"]

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lru = "0.12"
open = "5"
ratatui = "0.29"
ratatui-image = { version = "4", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
